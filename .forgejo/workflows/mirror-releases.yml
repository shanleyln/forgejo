name: mirror

on:
  workflow_dispatch:

  issues:
    types:
      - labeled

enable-email-notifications: true

jobs:
  release:
    if: contains(forge.event.issue.assignees.*.login, 'forgejo-read-only-issues') && forge.event.label.name == 'trigger'
    runs-on: docker
    container:
      image: 'code.forgejo.org/oci/debian:bookworm'
    steps:
      - name: install wget curl jq skopeo git
        shell: bash
        run: |
          ${{ vars.VERBOSE }}
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update && apt-get -q install -y -qq wget curl jq skopeo git

      - name: find the first missing version
        id: forgejo-version
        shell: bash
        run: |
          ${{ vars.VERBOSE }}
          if test -z "${{ vars.TEST_VERSION }}" ; then
            function get_versions() {
               local releases=$1
               local page=1
               while true; do
                 curl --fail -sS "$releases?limit=100&page=$page" | jq -r '.[] | .tag_name' > /tmp/page
                 cat /tmp/page
                 if ! test -s /tmp/page; then
                   break
                 fi
                 page=$(expr $page + 1)
               done | grep -v -e '-rc' | sort --version-sort
            }
            get_versions https://codeberg.org/api/v1/repos/forgejo/forgejo/releases > /tmp/codeberg
            get_versions https://${{ vars.TEST == 'true' && vars.TEST_DESTINATION || vars.DESTINATION }}/api/v1/repos/${{ vars.TEST == 'true' && vars.TEST_OWNER || vars.OWNER }}/forgejo/releases > /tmp/forgejo
            version=$(comm --nocheck-order -23 /tmp/codeberg /tmp/forgejo | head -1 | sed -e 's/^v//')
          else
            version="${{ vars.TEST_VERSION }}"
          fi
          if test "$version" ; then
             echo $version is missing
             sha=$(git ls-remote https://codeberg.org/forgejo/forgejo refs/tags/v$version | sed -e 's/\t.*//')
             major_version=$(echo $version | sed -E -e 's/^([0-9]+).*/\1/')
             minor_version=$(echo $version | sed -E -e 's/^([0-9]+\.[0-9]+).*/\1/')
             echo sha=$sha >> $FORGEJO_OUTPUT
             echo patch=$version >> $FORGEJO_OUTPUT
             echo minor=$minor_version >> $FORGEJO_OUTPUT
             if dpkg --compare-versions $version ge 7.0.0 ; then # prior to v7.0.0 there was no major short tag
               echo major=$major_version >> $FORGEJO_OUTPUT
             fi
          else
             echo all versions have been copied already
             cat /tmp/codeberg
          fi

      - name: copy missing container image
        if: steps.forgejo-version.outputs.patch != ''
        run: |
          skopeo login --username ${{ vars.TEST == 'true' && vars.TEST_DOER || vars.DOER }} --password "${{ vars.TEST == 'true' && secrets.TEST_FORGEJO_TOKEN || secrets.CODE_FORGEJO_TOKEN  }}" ${{ vars.TEST == 'true' && vars.TEST_DESTINATION || vars.DESTINATION }}
          set -x
          for version in ${{ steps.forgejo-version.outputs.patch }} ${{ steps.forgejo-version.outputs.minor }} ${{ steps.forgejo-version.outputs.major }} ; do
            for suffix in "" "-rootless" ; do
              image=forgejo:${version}${suffix}
              echo $image
              skopeo copy docker://codeberg.org/forgejo/$image docker://${{ vars.TEST == 'true' && vars.TEST_DESTINATION || vars.DESTINATION }}/${{ vars.TEST == 'true' && vars.TEST_OWNER || vars.OWNER }}/$image --all
            done
          done


      - name: download release
        if: steps.forgejo-version.outputs.patch != ''
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          url: https://codeberg.org
          repo: forgejo/forgejo
          direction: download
          tag: v${{ steps.forgejo-version.outputs.patch }}
          release-dir: release
          verbose: ${{ vars.TEST }}

      - name: upload release
        if: steps.forgejo-version.outputs.patch != ''
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          url: https://${{ vars.TEST == 'true' && vars.TEST_DESTINATION || vars.DESTINATION }}
          repo: ${{ vars.TEST == 'true' && vars.TEST_OWNER || vars.OWNER }}/forgejo
          direction: upload
          tag: v${{ steps.forgejo-version.outputs.patch }}
          sha: ${{ steps.forgejo-version.outputs.sha }}
          release-dir: release
          token: ${{ vars.TEST == 'true' && secrets.TEST_FORGEJO_TOKEN || secrets.CODE_FORGEJO_TOKEN  }}
          verbose: ${{ vars.TEST }}

      - name: clear the trigger label
        if: always()
        uses: https://code.forgejo.org/infrastructure/issue-action/set@v1.0.0
        with:
          forgejo: https://${{ vars.DESTINATION }}
          repository: ${{ vars.OWNER }}/forgejo
          token: ${{ secrets.LABEL_ISSUE_FORGEJO_MIRROR_TOKEN }}
          numbers: ${{ forge.event.issue.number }}
          unlabel: trigger
