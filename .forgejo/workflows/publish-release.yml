on:
  workflow_dispatch:

  schedule:
    - cron: '@hourly'

  push:
    branches:
      - 'main'

jobs:
  publish:
    runs-on: docker
    container:
      image: 'code.forgejo.org/oci/debian:bookworm'
    steps:
      - name: install curl jq skopeo
        shell: bash
        run: |
          ${{ vars.VERBOSE }}
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update && apt-get -q install -y -qq curl jq skopeo

      - name: find the first missing version
        id: forgejo-version
        shell: bash
        run: |
          ${{ vars.VERBOSE }}
          if test -z "${{ vars.TEST_VERSION }}" ; then
            function get_versions() {
               local host=$1
               curl -sS https://$host/api/v1/repos/forgejo/forgejo/releases?limit=100 | jq -r '.[] | .tag_name' | grep -v -e '-rc' | sort --version-sort
            }
            get_versions codeberg.org > /tmp/codeberg
            get_versions code.forgejo.org > /tmp/forgejo
            version=$(comm -23 /tmp/codeberg /tmp/forgejo | head -1 | sed -e 's/^v//')
          else
            version="${{ vars.TEST_VERSION }}"
          fi
          if test "$version" ; then
             echo $version is missing
             major_version=$(echo $version | sed -E -e 's/^([0-9]+).*/\1/')
             minor_version=$(echo $version | sed -E -e 's/^([0-9]+\.[0-9]+).*/\1/')
             echo patch=$version >> $GITHUB_OUTPUT
             echo minor=$minor_version >> $GITHUB_OUTPUT
             if dpkg --compare-versions $version ge 7.0.0 ; then # prior to v7.0.0 there was no major short tag
               echo major=$major_version >> $GITHUB_OUTPUT
             fi
          else
             echo all versions have been copied already
             cat /tmp/codeberg
          fi

      - name: copy missing version image
        if: steps.forgejo-version.outputs.patch != ''
        run: |
          ${{ vars.VERBOSE }}
          if test "${{ vars.TEST }}" != true ; then
            token=${{ secrets.CODE_FORGEJO_TOKEN }}
            doer=${{ vars.DOER }}
            destination=${{ vars.DESTINATION }}
            owner=${{ vars.OWNER }}
          else
            token=${{ secrets.TEST_FORGEJO_TOKEN }}
            doer=${{ vars.TEST_DOER }}
            destination=${{ vars.TEST_DESTINATION }}
            owner=${{ vars.TEST_OWNER }}
          fi
          skopeo login --username $doer --password "$token" $destination
          set -x
          for version in ${{ steps.forgejo-version.outputs.patch }} ${{ steps.forgejo-version.outputs.minor }} ${{ steps.forgejo-version.outputs.major }} ; do
            for suffix in "" "-rootless" ; do
              image=forgejo:${version}${suffix}
              echo $image
              skopeo copy docker://codeberg.org/forgejo/$image docker://$destination/$owner/$image --all
            done
          done
